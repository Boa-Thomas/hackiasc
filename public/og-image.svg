<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050510;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a24;stop-opacity:1" />
    </linearGradient>

    <!-- Cyan glow -->
    <radialGradient id="glow-cyan" cx="30%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#06d6a0;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#06d6a0;stop-opacity:0" />
    </radialGradient>

    <!-- Electric glow -->
    <radialGradient id="glow-electric" cx="75%" cy="65%" r="45%">
      <stop offset="0%" style="stop-color:#3a86ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#3a86ff;stop-opacity:0" />
    </radialGradient>

    <!-- Violet accent -->
    <radialGradient id="glow-violet" cx="55%" cy="10%" r="35%">
      <stop offset="0%" style="stop-color:#8338ec;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#8338ec;stop-opacity:0" />
    </radialGradient>

    <!-- Title gradient (cyan to electric) -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06d6a0" />
      <stop offset="100%" style="stop-color:#3a86ff" />
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Glow orbs -->
  <ellipse cx="240" cy="260" rx="400" ry="320" fill="url(#glow-cyan)" />
  <ellipse cx="900" cy="400" rx="360" ry="280" fill="url(#glow-electric)" />
  <ellipse cx="660" cy="60" rx="280" ry="200" fill="url(#glow-violet)" />

  <!-- Decorative circles (outline rings) -->
  <circle cx="1080" cy="80" r="120" fill="none" stroke="#3a86ff" stroke-width="1" stroke-opacity="0.15" />
  <circle cx="1080" cy="80" r="80" fill="none" stroke="#3a86ff" stroke-width="0.8" stroke-opacity="0.1" />
  <circle cx="120" cy="560" r="90" fill="none" stroke="#06d6a0" stroke-width="1" stroke-opacity="0.12" />
  <circle cx="120" cy="560" r="55" fill="none" stroke="#06d6a0" stroke-width="0.7" stroke-opacity="0.08" />
  <circle cx="600" cy="315" r="500" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03" />

  <!-- Dotted accent line top -->
  <line x1="80" y1="50" x2="400" y2="50" stroke="#06d6a0" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="4 8" />

  <!-- Top label -->
  <rect x="80" y="66" width="8" height="8" rx="4" fill="#06d6a0" />
  <text x="100" y="76" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="14" fill="#06d6a0" letter-spacing="3" opacity="0.8">AI HACKATHON · BLUMENAU 2026</text>

  <!-- Main title: "HackIA" -->
  <text x="80" y="220" font-family="'Sora', 'Arial', sans-serif" font-size="118" font-weight="800" fill="white" letter-spacing="-4">Hack</text>
  <text x="380" y="220" font-family="'Sora', 'Arial', sans-serif" font-size="118" font-weight="800" fill="url(#text-gradient)" letter-spacing="-4">IA</text>
  <text x="504" y="220" font-family="'Sora', 'Arial', sans-serif" font-size="118" font-weight="800" fill="white" letter-spacing="-4"> SC</text>

  <!-- Subtitle: AI Hackathon Blumenau 2026 -->
  <text x="80" y="278" font-family="'Sora', 'Arial', sans-serif" font-size="30" font-weight="300" fill="#c8d0e0" letter-spacing="0.5" opacity="0.85">Crie startups reais e escaláveis com Inteligência Artificial.</text>

  <!-- Divider line -->
  <line x1="80" y1="312" x2="700" y2="312" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.12" />

  <!-- Info row -->
  <!-- Date -->
  <text x="80" y="356" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="20" fill="#06d6a0" font-weight="700">29–31 de Maio</text>
  <text x="80" y="380" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" fill="#8899b0" opacity="0.8">CIB Blumenau, SC</text>

  <!-- Vertical separator -->
  <line x1="310" y1="344" x2="310" y2="388" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.2" />

  <!-- Prize -->
  <text x="330" y="356" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="20" fill="#ffbe0b" font-weight="700">R$9.000+ em prêmios</text>
  <text x="330" y="380" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" fill="#8899b0" opacity="0.8">Capital semente para sua startup</text>

  <!-- Domain pill bottom right -->
  <rect x="940" y="554" width="180" height="36" rx="18" fill="#06d6a0" fill-opacity="0.1" stroke="#06d6a0" stroke-width="1" stroke-opacity="0.3" />
  <text x="1030" y="577" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" fill="#06d6a0" text-anchor="middle" font-weight="700">hackiasc.com</text>

  <!-- Bottom accent dots -->
  <circle cx="80" cy="580" r="3" fill="#06d6a0" opacity="0.6" />
  <circle cx="96" cy="580" r="3" fill="#3a86ff" opacity="0.4" />
  <circle cx="112" cy="580" r="3" fill="#8338ec" opacity="0.4" />
</svg>
