<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — HackIA SC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: 'Sora', sans-serif;
        background: #050510;
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }

      /* Grid background */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(58, 134, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(58, 134, 255, 0.03) 1px, transparent 1px);
        background-size: 60px 60px;
        pointer-events: none;
      }

      /* Orbs */
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        pointer-events: none;
        animation: float 6s ease-in-out infinite;
      }
      .orb-1 {
        width: 400px;
        height: 400px;
        background: rgba(6, 214, 160, 0.12);
        top: -100px;
        right: -100px;
      }
      .orb-2 {
        width: 350px;
        height: 350px;
        background: rgba(131, 56, 236, 0.1);
        bottom: -80px;
        left: -80px;
        animation-delay: -3s;
      }
      .orb-3 {
        width: 250px;
        height: 250px;
        background: rgba(58, 134, 255, 0.08);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation-delay: -1.5s;
      }

      .container {
        text-align: center;
        position: relative;
        z-index: 1;
        padding: 2rem;
        max-width: 600px;
      }

      .error-code {
        font-family: 'JetBrains Mono', monospace;
        font-size: clamp(6rem, 20vw, 12rem);
        font-weight: 700;
        line-height: 1;
        background: linear-gradient(135deg, #06d6a0, #3a86ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.5rem;
        animation: slide-up 0.7s ease-out both;
      }

      .glitch-line {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.85rem;
        color: #7a7aa0;
        margin-bottom: 2rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        animation: slide-up 0.7s ease-out 0.1s both;
      }

      .message {
        font-size: 1.15rem;
        color: #b0b0d0;
        line-height: 1.7;
        margin-bottom: 2.5rem;
        animation: slide-up 0.7s ease-out 0.2s both;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.9rem 2rem;
        font-family: 'Sora', sans-serif;
        font-size: 1rem;
        font-weight: 600;
        color: #050510;
        background: linear-gradient(135deg, #06d6a0, #3a86ff);
        border: none;
        border-radius: 12px;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 0 20px rgba(6, 214, 160, 0.3), 0 0 60px rgba(6, 214, 160, 0.1);
        animation: slide-up 0.7s ease-out 0.3s both;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 30px rgba(6, 214, 160, 0.5), 0 0 80px rgba(6, 214, 160, 0.2);
      }
      .btn:active {
        transform: translateY(0);
      }

      .terminal-hint {
        margin-top: 2.5rem;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.8rem;
        color: #3a3a5e;
        animation: slide-up 0.7s ease-out 0.4s both;
      }
      .terminal-hint span {
        color: #06d6a0;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-20px) scale(1.05); }
      }
      @keyframes slide-up {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">
      <div class="error-code">404</div>
      <div class="glitch-line">file_not_found</div>
      <p class="message">
        Esta rota não existe — ou talvez ainda não tenha sido hackeada.<br />
        Volte para a página principal e continue construindo o futuro.
      </p>
      <a href="/" class="btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12l9-9 9 9"/><path d="M9 21V9h6v12"/>
        </svg>
        Voltar ao Início
      </a>
      <div class="terminal-hint"><span>$</span> cd /home — <span>hackia_sc</span> awaits</div>
    </div>
  </body>
</html>
