<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Slide 2 — HackIA SC</title>
<style>
  :root {
    --dark: #050510;
    --cyan: #06d6a0;
    --electric: #3a86ff;
    --violet: #8338ec;
    --gold: #ffbe0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @page { size: 1280px 720px; margin: 0; }
  @media print {
    html, body { min-height: 0; display: block; background: var(--dark); }
    .slide { transform: none; box-shadow: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  html, body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .slide {
    position: relative;
    width: 1280px;
    height: 720px;
    background: var(--dark);
    overflow: hidden;
    transform: scale(min(calc(100vw / 1280), calc(100vh / 720)));
    transform-origin: center;
    box-shadow: 0 30px 120px rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .slide::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(58,134,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(58,134,255,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }

  .orb { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
  .orb-1 { width: 480px; height: 480px; background: var(--gold);     top: -160px; left: -120px; opacity: 0.30; }
  .orb-2 { width: 460px; height: 460px; background: var(--hot, #ff006e); bottom: -180px; right: -120px; opacity: 0.30; }
  .orb-3 { width: 420px; height: 420px; background: var(--electric); top: 35%; left: 42%; opacity: 0.22; }

  /* soft halo behind the product */
  .halo {
    position: absolute;
    width: 760px; height: 760px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,190,11,0.20), rgba(255,0,110,0.10) 45%, transparent 65%);
    filter: blur(10px);
    z-index: 1;
  }

  .hero-img {
    position: relative;
    z-index: 2;
    max-width: 80%;
    max-height: 84%;
    object-fit: contain;
    border-radius: 22px;
    border: 1px solid rgba(58,134,255,0.28);
    box-shadow:
      0 0 40px rgba(255,190,11,0.18),
      0 0 80px rgba(255,0,110,0.10),
      0 30px 60px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="halo"></div>
    <img class="hero-img" src="LTAT7LJIEFBJTNHLJFVAGNCKJI.avif" alt="" />
  </div>
</body>
</html>
