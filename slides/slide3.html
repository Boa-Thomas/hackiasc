<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Slide 3 — HackIA SC</title>
<style>
  :root {
    --dark: #050510;
    --cyan: #06d6a0;
    --electric: #3a86ff;
    --violet: #8338ec;
    --hot: #ff006e;
    --gold: #ffbe0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @page { size: 1280px 720px; margin: 0; }
  @media print {
    html, body { min-height: 0; display: block; background: var(--dark); }
    .slide { transform: none; box-shadow: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  html, body {
    background: #000;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }

  .slide {
    position: relative;
    width: 1280px; height: 720px;
    background: var(--dark); overflow: hidden;
    transform: scale(min(calc(100vw / 1280), calc(100vh / 720)));
    transform-origin: center;
    box-shadow: 0 30px 120px rgba(0,0,0,0.6);
  }
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(58,134,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(58,134,255,0.04) 1px, transparent 1px);
    background-size: 48px 48px; pointer-events: none;
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
  .orb-1 { width: 460px; height: 460px; background: var(--hot);      top: -170px; left: -120px; opacity: 0.28; }
  .orb-2 { width: 460px; height: 460px; background: var(--gold);     bottom: -180px; right: -120px; opacity: 0.26; }
  .orb-3 { width: 360px; height: 360px; background: var(--electric); top: 38%; left: 44%; opacity: 0.20; }

  .duo {
    position: relative; z-index: 2; height: 100%;
    display: grid; grid-template-columns: 1fr 1fr; gap: 44px; padding: 56px 64px;
  }
  .prod-card {
    border-radius: 22px; border: 1px solid rgba(58,134,255,0.28); background: #fff;
    box-shadow: 0 0 36px rgba(6,214,160,0.16), 0 0 70px rgba(58,134,255,0.10), 0 24px 60px rgba(0,0,0,0.5);
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .prod-card img { width: 100%; height: 100%; object-fit: contain; padding: 26px; }
</style>
</head>
<body>
  <div class="slide">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="duo">
      <div class="prod-card"><img src="Slide2.png" alt="" /></div>
      <div class="prod-card"><img src="Slide2.webp" alt="" /></div>
    </div>
  </div>
</body>
</html>
